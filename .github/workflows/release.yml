name: Release PC binaries (Windows + Linux)

# Produit des binaires PRETS A TELECHARGER (pas juste des artefacts de
# CI temporaires) pour la build PC/SDL, attaches a une Release GitHub.
# Se declenche sur un tag de version (v1.0.0, v1.2.3, ...) ou
# manuellement (bouton "Run workflow").
#
# Complementaire de build-pc.yml (verification a chaque push/PR, sans
# release) -- celui-ci sert specifiquement a publier des binaires
# distribuables.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de version pour cette release, ex. v1.0.0'
        required: true
        type: string

permissions:
  contents: write # necessaire pour creer la Release et y attacher les binaires

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Meme precaution que build-aka.yml (voir ce fichier pour le
      # contexte complet).
      - name: Remove stale build cache
        shell: bash
        run: rm -rf build

      # --- Linux : SDL2/SDL2_image/SDL2_mixer via apt ---
      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev

      # --- Windows : SDL2/SDL2_image/SDL2_mixer via vcpkg (preinstalle
      # sur les runners windows-latest de GitHub) ---
      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sdl2:x64-windows sdl2-image:x64-windows sdl2-mixer:x64-windows

          # BUG TROUVE ET CORRIGE (meme cause que build-pc.yml, voir ce
          # fichier pour le contexte complet) : $env:VCPKG_ROOT vide sur
          # ce runner -- resolu via l'executable vcpkg reel plutot que
          # de compter sur la variable d'environnement.
          $vcpkgExe = (Get-Command vcpkg -ErrorAction Stop).Source
          $vcpkgRoot = Split-Path -Parent $vcpkgExe
          $toolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
          if (-not (Test-Path $toolchain)) {
            throw "Fichier toolchain vcpkg introuvable : $toolchain"
          }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_INSTALLED=$vcpkgRoot\installed\x64-windows" >> $env:GITHUB_ENV
          "CMAKE_TOOLCHAIN_FILE=$toolchain" >> $env:GITHUB_ENV

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S platform_sdl -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S platform_sdl -B build -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE" -DVCPKG_TARGET_TRIPLET=x64-windows -A x64

      - name: Build
        run: cmake --build build --config Release

      # --- Assemble le paquet a publier : executable + ressources
      # d'execution (data/lang/music) + DLL SDL2 sur Windows (liaison
      # dynamique, sinon l'exe ne demarre pas chez quelqu'un qui n'a pas
      # SDL2 installe) ---
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp build/darkandundercolor_pc package/
          cp -r platform_sdl/data package/
          cp -r platform_sdl/lang package/
          cp -r platform_sdl/music package/
          cd package && zip -r ../darkandundercolor-${{ matrix.name }}.zip . && cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir package
          Copy-Item build\Release\darkandundercolor_pc.exe package\
          Copy-Item -Recurse platform_sdl\data package\
          Copy-Item -Recurse platform_sdl\lang package\
          Copy-Item -Recurse platform_sdl\music package\
          # DLL runtime SDL2 et leurs dependances transitives (formats
          # image/son) -- copie tout ce qui existe dans bin/, plus
          # simple et plus sur que de lister chaque DLL individuellement.
          Copy-Item "$env:VCPKG_INSTALLED\bin\*.dll" package\ -Force
          Compress-Archive -Path package\* -DestinationPath darkandundercolor-${{ matrix.name }}.zip

      # BUG TROUVE ET CORRIGE (fiabilite, signale par Jicehel) : l'upload
      # vers la Release se faisait auparavant directement ICI, dans
      # CHAQUE job de la matrice -- les deux jobs (Windows et Linux)
      # tentaient de creer/modifier la MEME Release en meme temps,
      # risque de course. Chaque job depose maintenant juste son zip en
      # artefact de workflow ; un job "release" separe (ci-dessous),
      # qui attend que LES DEUX aient fini, telecharge les deux et cree
      # la Release une seule fois.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkandundercolor-${{ matrix.name }}
          path: darkandundercolor-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # BUG TROUVE ET CORRIGE (signale par Jicehel, log de build a
      # l'appui) : softprops/action-gh-release exige un tag -- un
      # declenchement manuel (workflow_dispatch) n'en fournit pas via
      # github.ref_name (qui vaut le nom de la BRANCHE dans ce cas, pas
      # un tag). "inputs.release_tag" (saisi a la main lors du
      # declenchement manuel) prend le relais dans ce cas ; sur un vrai
      # push de tag, github.ref_name est deja correct.
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.zip
          generate_release_notes: true
